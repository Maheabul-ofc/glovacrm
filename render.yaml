services:
  # ── Backend API ────────────────────────────────────────────────────────────
  - type: web
    name: glovacrm-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma db push --accept-data-loss && node dist/seed.js && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: glovacrm-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

  # ── Frontend Web App ───────────────────────────────────────────────────────
  - type: web
    name: glovacrm-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_URL
        fromService:
          type: web
          name: glovacrm-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: glovacrm-backend
          envVarKey: RENDER_EXTERNAL_URL

# ── Managed Databases ────────────────────────────────────────────────────────
databases:
  - name: glovacrm-db
    plan: free
    databaseName: glovacrm
    user: glovacrm_user
